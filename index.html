    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<body>
    <div id="app">
        <div class="demo-badge" id="demoBadge" style="display:none">DEMO</div>
        <header id="appHeader">
            <div class="avatar" id="avatarEl">?</div>
            <div class="greeting"><div class="name" id="greetingName">Привет</div><div class="sub" id="greetingSub"></div></div>
            <div class="period-selector" id="periodSelector"></div>
        </header>
        <main id="mainContent"></main>

    </div>
    <script>
        (function() {
            // ==================== CONFIG ====================
            const CONFIG = {
                API_URL: 'https://adiqvgwbffcqxcmftfah.supabase.co/functions/v1/swift-function',
                DEMO_MODE: true,
                APP_NAME: 'Balance',
                CURRENCY_SYMBOLS: { RUB: '₽' },
                PERIODS: [
                    { key: 'current', label: 'Месяц' },
                    { key: 'prev', label: 'Прошлый' },
                    { key: '3m', label: '3 мес' },
                    { key: 'year', label: 'Год' },
                ],
                INCOME_CATEGORIES: ['Зарплата', 'Подработка', 'Бизнес', 'Инвестиции', 'Подарки', 'Возврат', 'Другое'],
                INCOME_ICONS: ['💰', '🔧', '🏢', '📈', '🎁', '↩️', '📋'],
                EXPENSE_CATEGORIES: [
                    'Продукты', 'Кафе и рестораны', 'Транспорт', 'Такси', 'Жилье', 'Коммунальные услуги',
                    'Связь и интернет', 'Подписки', 'Здоровье', 'Аптека', 'Одежда', 'Развлечения',
                    'Путешествия', 'Образование', 'Покупки', 'Семья', 'Подарки', 'Спорт', 'Красота',
                    'Налоги', 'Кредиты', 'Другое'
                ],
                EXPENSE_ICONS: [
                    '🛒', '🍽️', '🚌', '🚕', '🏠', '💡', '📱', '🔄', '❤️', '💊', '👗', '🎬',
                    '✈️', '📚', '🛍️', '👨‍👩‍👧', '🎁', '🏋️', '💅', '📝', '💳', '📋'
                ],
                MAX_NAME_LEN: 80,
                MAX_DESC_LEN: 200,
            };
            // ==================== TELEGRAM ====================
            const tg = window.Telegram?.WebApp;
            const isTelegram = !!(tg && tg.initDataUnsafe?.user);
            if (!isTelegram) {
                CONFIG.DEMO_MODE = true;
            } else {
                CONFIG.DEMO_MODE = false;
            }
            if (tg) { tg.ready(); tg.expand(); }
            // ==================== STATE ====================
            const state = {
                user: null,
                settings: { currency: 'RUB' },
                transactions: [],
                credits: [],
                creditPayments: [],
                recurringExpenses: [],
                recurringPayments: [],
                categories: [],
                selectedPeriod: 'current',
                currentTab: 'dashboard',
                loading: false,
                error: null,
                demoStorage: null,
            };
            // ==================== UTILS ====================
            function $(sel) { return document.querySelector(sel); }
            function $$(sel) { return document.querySelectorAll(sel); }
            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str || '';
                return div.innerHTML;
            }
            function uid() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }
            function nowISO() { return new Date().toISOString().split('T')[0]; }
            function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
            // ==================== MONEY ====================
            function moneyToMinor(amount) { return Math.round(parseFloat(amount || 0) * 100); }
            function minorToMoney(minor) { return (minor || 0) / 100; }
            function formatMoney(minor) {
                const val = minorToMoney(minor);
                return new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(val) + ' ₽';
            }
            // ==================== DATE HELPERS ====================
            function formatDateRu(dateStr) {
                if (!dateStr) return '—';
                const parts = dateStr.split('-');
                if (parts.length !== 3) return dateStr;
                return `${parts[2]}.${parts[1]}.${parts[0]}`;
            }
            function getPeriodRange(periodKey) {
                const now = new Date();
                const y = now.getFullYear();
                const m = now.getMonth();
                switch (periodKey) {
                    case 'current': return { start: new Date(y, m, 1), end: new Date(y, m + 1, 0) };
                    case 'prev': return { start: new Date(y, m - 1, 1), end: new Date(y, m, 0) };
                    case '3m': return { start: new Date(y, m - 2, 1), end: new Date(y, m + 1, 0) };
                    case 'year': return { start: new Date(y, 0, 1), end: new Date(y, 11, 31) };
                    default: return { start: new Date(y, m, 1), end: new Date(y, m + 1, 0) };
                }
            }
            function isInRange(dateStr, range) {
                if (!dateStr) return false;
                const d = new Date(dateStr);
                return d >= range.start && d <= range.end;
            }
            function daysUntil(dateStr) {
                if (!dateStr) return null;
                const d = new Date(dateStr);
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                d.setHours(0, 0, 0, 0);
                return Math.ceil((d - now) / (1000 * 60 * 60 * 24));
            }
            function addMonth(dateStr) {
                if (!dateStr) return nowISO();
                const d = new Date(dateStr);
                d.setMonth(d.getMonth() + 1);
                if (d.getDate() < new Date(dateStr).getDate()) d.setDate(0);
                return d.toISOString().split('T')[0];
            }
            // ==================== DEMO STORAGE ====================
            function initDemoStorage() {
                const key = 'balance_demo_v3';
                let data = null;
                try { const raw = localStorage.getItem(key); if (raw) data = JSON.parse(raw); } catch (e) {}
                if (!data || !data._version) {
                    const now = nowISO();
                    const nextMonth = addMonth(now);
                    const catMap = {};
                    CONFIG.EXPENSE_CATEGORIES.forEach((n, i) => { catMap['exp_' + n] = { id: 'cat_exp_' + i, name: n, icon: CONFIG.EXPENSE_ICONS[i] || '📋', type: 'expense', is_system: true, user_id: null }; });
                    CONFIG.INCOME_CATEGORIES.forEach((n, i) => { catMap['inc_' + n] = { id: 'cat_inc_' + i, name: n, icon: CONFIG.INCOME_ICONS[i] || '💰', type: 'income', is_system: true, user_id: null }; });
                    const categories = [...Object.values(catMap).filter(c => c.type === 'expense'), ...Object.values(catMap).filter(c => c.type === 'income')];
                    const tx1 = { id: 'tx1', type: 'income', amount_minor: 320000, category_id: 'cat_inc_0', description: 'Зарплата', transaction_date: now, created_at: now, source_type: null, source_id: null };
                    const tx2 = { id: 'tx2', type: 'expense', amount_minor: 7240, category_id: 'cat_exp_0', description: 'Продукты', transaction_date: now, created_at: now, source_type: null, source_id: null };
                    const tx3 = { id: 'tx3', type: 'expense', amount_minor: 1850, category_id: 'cat_exp_3', description: 'Такси', transaction_date: now, created_at: now, source_type: null, source_id: null };
                    const tx4 = { id: 'tx4', type: 'expense', amount_minor: 1200, category_id: 'cat_exp_7', description: 'Подписки', transaction_date: now, created_at: now, source_type: null, source_id: null };
                    const tx5 = { id: 'tx5', type: 'expense', amount_minor: 4500, category_id: 'cat_exp_1', description: 'Кафе и рестораны', transaction_date: now, created_at: now, source_type: null, source_id: null };
                    const tx6 = { id: 'tx6', type: 'expense', amount_minor: 3990, category_id: 'cat_exp_6', description: 'Связь и интернет', transaction_date: now, created_at: now, source_type: null, source_id: null };
                    const credit1 = { id: 'cr1', name: 'Телефон', initial_amount_minor: 120000, remaining_amount_minor: 80000, payment_amount_minor: 10000, next_payment_date: nextMonth, note: '', status: 'active', created_at: now, updated_at: now };
                    const rec1 = { id: 'rec1', name: 'Аренда', amount_minor: 90000, category_id: 'cat_exp_4', next_payment_date: nextMonth, recurrence: 'monthly', active: true, note: '', created_at: now, updated_at: now };
                    const rec2 = { id: 'rec2', name: 'Интернет', amount_minor: 3990, category_id: 'cat_exp_6', next_payment_date: nextMonth, recurrence: 'monthly', active: true, note: '', created_at: now, updated_at: now };
                    const rec3 = { id: 'rec3', name: 'Spotify', amount_minor: 1099, category_id: 'cat_exp_7', next_payment_date: nextMonth, recurrence: 'monthly', active: true, note: '', created_at: now, updated_at: now };
                    const rec4 = { id: 'rec4', name: 'Спортзал', amount_minor: 4500, category_id: 'cat_exp_17', next_payment_date: nextMonth, recurrence: 'monthly', active: true, note: '', created_at: now, updated_at: now };
                    const recPay1 = { id: 'recp1', recurring_expense_id: 'rec1', due_date: now, paid_at: now, transaction_id: 'tx_rec1', amount_minor: 90000, idempotency_key: 'rec1_' + now, created_at: now };
                    const recTx1 = { id: 'tx_rec1', type: 'expense', amount_minor: 90000, category_id: 'cat_exp_4', description: 'Аренда (постоянный)', transaction_date: now, created_at: now, source_type: 'recurring', source_id: 'rec1' };
                    const recPay2 = { id: 'recp2', recurring_expense_id: 'rec2', due_date: now, paid_at: now, transaction_id: 'tx_rec2', amount_minor: 3990, idempotency_key: 'rec2_' + now, created_at: now };
                    const recTx2 = { id: 'tx_rec2', type: 'expense', amount_minor: 3990, category_id: 'cat_exp_6', description: 'Интернет (постоянный)', transaction_date: now, created_at: now, source_type: 'recurring', source_id: 'rec2' };
                    data = {
                        _version: 2,
                        settings: { currency: 'RUB' },
                        transactions: [tx1, tx2, tx3, tx4, tx5, tx6, recTx1, recTx2],
                        credits: [credit1],
                        creditPayments: [],
                        recurringExpenses: [rec1, rec2, rec3, rec4],
                        recurringPayments: [recPay1, recPay2],
                        categories: categories,
                    };
                    try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
                }
                state.settings = data.settings || { currency: 'RUB' };
                state.transactions = data.transactions || [];
                state.credits = data.credits || [];
                state.creditPayments = data.creditPayments || [];
                state.recurringExpenses = data.recurringExpenses || [];
                state.recurringPayments = data.recurringPayments || [];
                state.categories = data.categories || [];
                state.demoStorage = data;
            }
            function saveDemoStorage() {
                if (!CONFIG.DEMO_MODE) return;
                const data = {
                    _version: 2,
                    settings: state.settings,
                    transactions: state.transactions,
                    credits: state.credits,
                    creditPayments: state.creditPayments,
                    recurringExpenses: state.recurringExpenses,
                    recurringPayments: state.recurringPayments,
                    categories: state.categories,
                };
                try { localStorage.setItem('balance_demo_v3', JSON.stringify(data)); } catch (e) {}
            }
            // ==================== API ====================
            async function apiRequest(action, payload = {}) {
                if (CONFIG.DEMO_MODE) return demoApiHandler(action, payload);
                const headers = { 'Content-Type': 'application/json' };
                // Передаём initData внутри тела запроса
                const bodyPayload = {
                    action: action,
                    payload: { ...payload, _initData: tg?.initData || '' }
                };
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 15000);
                try {
                    const resp = await fetch(CONFIG.API_URL, { method: 'POST', headers, body: JSON.stringify(bodyPayload), signal: controller.signal });
                    clearTimeout(timeout);
                    let json;
                    try {
                        json = await resp.json();
                    } catch (e) {
                        throw new Error(`HTTP ${resp.status} – ответ не JSON`);
                    }
                    if (!resp.ok) {
                        const serverMsg = json?.error?.message || json?.message || `HTTP ${resp.status}`;
                        throw new Error(serverMsg);
                    }
                    if (json.ok === false) {
                        throw new Error(json.error?.message || 'API error');
                    }
                    return json.data;
                } catch (e) {
                    clearTimeout(timeout);
                    if (e.name === 'AbortError') throw new Error('Таймаут запроса');
                    throw e;
                }
            }
            // ... (demoApiHandler без изменений)
            function demoApiHandler(action, payload) {
                switch (action) {
                    case 'bootstrap':
                        return {
                            user: { id: 'demo_user', first_name: 'Алекс', username: 'alex_demo' },
                            settings: state.settings,
                            transactions: state.transactions,
                            credits: state.credits,
                            creditPayments: state.creditPayments,
                            recurringExpenses: state.recurringExpenses,
                            recurringPayments: state.recurringPayments,
                            categories: state.categories,
                        };
                    case 'create_transaction':
                        const tx = { ...payload, id: uid(), created_at: nowISO(), source_type: payload.source_type || null, source_id: payload.source_id || null };
                        state.transactions.push(tx);
                        saveDemoStorage();
                        return tx;
                    case 'update_transaction':
                        const idx = state.transactions.findIndex(t => t.id === payload.id);
                        if (idx >= 0) state.transactions[idx] = { ...state.transactions[idx], ...payload, updated_at: nowISO() };
                        saveDemoStorage();
                        return state.transactions[idx];
                    case 'delete_transaction':
                        state.transactions = state.transactions.filter(t => t.id !== payload.id);
                        saveDemoStorage();
                        return { deleted: true };
                    case 'create_credit':
                        const cr = { ...payload, id: uid(), created_at: nowISO(), updated_at: nowISO() };
                        state.credits.push(cr);
                        saveDemoStorage();
                        return cr;
                    case 'update_credit':
                        const ci = state.credits.findIndex(c => c.id === payload.id);
                        if (ci >= 0) state.credits[ci] = { ...state.credits[ci], ...payload, updated_at: nowISO() };
                        saveDemoStorage();
                        return state.credits[ci];
                    case 'delete_credit':
                        state.credits = state.credits.filter(c => c.id !== payload.id);
                        saveDemoStorage();
                        return { deleted: true };
                    case 'mark_credit_payment_paid':
                        const credit = state.credits.find(c => c.id === payload.credit_id);
                        if (!credit || credit.status === 'closed') throw new Error('Кредит не найден или закрыт');
                        const existingPay = state.creditPayments.find(p => p.idempotency_key === payload.idempotency_key);
                        if (existingPay) return existingPay;
                        let actualPayment = Math.min(credit.payment_amount_minor, credit.remaining_amount_minor);
                        credit.remaining_amount_minor -= actualPayment;
                        if (credit.remaining_amount_minor <= 0) { credit.remaining_amount_minor = 0; credit.status = 'closed'; }
                        credit.next_payment_date = payload.next_payment_date || addMonth(credit.next_payment_date);
                        credit.updated_at = nowISO();
                        const cpTx = { id: uid(), type: 'expense', amount_minor: actualPayment, category_id: payload.category_id || state.categories.find(c => c.name === 'Кредиты' && c.type === 'expense')?.id || 'cat_exp_20', description: 'Платеж: ' + credit.name, transaction_date: nowISO(), created_at: nowISO(), source_type: 'credit', source_id: credit.id };
                        state.transactions.push(cpTx);
                        const cp = { id: uid(), credit_id: credit.id, amount_minor: actualPayment, payment_date: nowISO(), transaction_id: cpTx.id, idempotency_key: payload.idempotency_key, created_at: nowISO() };
                        state.creditPayments.push(cp);
                        saveDemoStorage();
                        return { credit, payment: cp, transaction: cpTx };
                    case 'create_recurring_expense':
                        const re = { ...payload, id: uid(), created_at: nowISO(), updated_at: nowISO() };
                        state.recurringExpenses.push(re);
                        saveDemoStorage();
                        return re;
                    case 'update_recurring_expense':
                        const ri = state.recurringExpenses.findIndex(r => r.id === payload.id);
                        if (ri >= 0) state.recurringExpenses[ri] = { ...state.recurringExpenses[ri], ...payload, updated_at: nowISO() };
                        saveDemoStorage();
                        return state.recurringExpenses[ri];
                    case 'delete_recurring_expense':
                        state.recurringExpenses = state.recurringExpenses.filter(r => r.id !== payload.id);
                        saveDemoStorage();
                        return { deleted: true };
                    case 'mark_recurring_expense_paid':
                        const rec = state.recurringExpenses.find(r => r.id === payload.recurring_expense_id);
                        if (!rec || !rec.active) throw new Error('Постоянный расход не найден или неактивен');
                        const existRP = state.recurringPayments.find(p => p.idempotency_key === payload.idempotency_key);
                        if (existRP) return existRP;
                        const rpTx = { id: uid(), type: 'expense', amount_minor: rec.amount_minor, category_id: rec.category_id, description: rec.name + ' (постоянный)', transaction_date: nowISO(), created_at: nowISO(), source_type: 'recurring', source_id: rec.id };
                        state.transactions.push(rpTx);
                        const rp = { id: uid(), recurring_expense_id: rec.id, due_date: rec.next_payment_date || nowISO(), paid_at: nowISO(), transaction_id: rpTx.id, idempotency_key: payload.idempotency_key, created_at: nowISO() };
                        state.recurringPayments.push(rp);
                        rec.next_payment_date = payload.next_payment_date || addMonth(rec.next_payment_date || nowISO());
                        rec.updated_at = nowISO();
                        saveDemoStorage();
                        return { recurring_expense: rec, payment: rp, transaction: rpTx };
                    case 'create_category':
                        const cat = { ...payload, id: uid(), is_system: false, user_id: 'demo_user', created_at: nowISO() };
                        state.categories.push(cat);
                        saveDemoStorage();
                        return cat;
                    case 'update_category':
                        const ci2 = state.categories.findIndex(c => c.id === payload.id);
                        if (ci2 >= 0) state.categories[ci2] = { ...state.categories[ci2], ...payload };
                        saveDemoStorage();
                        return state.categories[ci2];
                    case 'delete_category':
                        state.categories = state.categories.filter(c => c.id !== payload.id);
                        saveDemoStorage();
                        return { deleted: true };
                    case 'update_settings':
                        state.settings = { ...state.settings, ...payload };
                        saveDemoStorage();
                        return state.settings;
                    default:
                        throw new Error('Unknown action: ' + action);
                }
            }
            // ==================== CALCULATIONS ====================
            function calcBalance() {
                const totalIncome = state.transactions.filter(t => t.type === 'income').reduce((s, t) => s + (t.amount_minor || 0), 0);
                const totalExpense = state.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + (t.amount_minor || 0), 0);
                return totalIncome - totalExpense;
            }
            function calcPeriodStats(periodKey) {
                const range = getPeriodRange(periodKey);
                const txs = state.transactions.filter(t => isInRange(t.transaction_date, range));
                const income = txs.filter(t => t.type === 'income').reduce((s, t) => s + (t.amount_minor || 0), 0);
                const expense = txs.filter(t => t.type === 'expense').reduce((s, t) => s + (t.amount_minor || 0), 0);
                const cashFlow = income - expense;
                return { income, expense, cashFlow, txs, range };
            }
            function calcUnpaidObligations() {
                const range = getPeriodRange(state.selectedPeriod);
                const endOfPeriod = range.end;
                let unpaid = 0;
                state.credits.filter(c => c.status === 'active').forEach(c => {
                    if (c.next_payment_date && new Date(c.next_payment_date) <= endOfPeriod) {
                        const paid = state.creditPayments.filter(p => p.credit_id === c.id && isInRange(p.payment_date, range)).reduce((s, p) => s + (p.amount_minor || 0), 0);
                        unpaid += Math.max(0, c.payment_amount_minor - paid);
                    }
                });
                state.recurringExpenses.filter(r => r.active).forEach(r => {
                    if (r.next_payment_date && new Date(r.next_payment_date) <= endOfPeriod) {
                        const paid = state.recurringPayments.filter(p => p.recurring_expense_id === r.id && isInRange(p.paid_at || p.due_date, range)).reduce((s, p) => s + (p.amount_minor || 0), 0);
                        unpaid += Math.max(0, r.amount_minor - paid);
                    }
                });
                return unpaid;
            }
            function calcFreeBalance() { return calcBalance() - calcUnpaidObligations(); }
            function calcCategoryStats(periodKey) {
                const { txs } = calcPeriodStats(periodKey);
                const expenseTxs = txs.filter(t => t.type === 'expense');
                const totalExp = expenseTxs.reduce((s, t) => s + (t.amount_minor || 0), 0);
                const map = {};
                expenseTxs.forEach(t => {
                    const catId = t.category_id || 'unknown';
                    if (!map[catId]) map[catId] = { amount: 0, count: 0 };
                    map[catId].amount += t.amount_minor || 0;
                    map[catId].count++;
                });
                const cats = Object.entries(map).map(([catId, data]) => {
                    const cat = state.categories.find(c => c.id === catId) || { name: 'Без категории', icon: '📋', type: 'expense' };
                    return { ...cat, ...data, percent: totalExp > 0 ? (data.amount / totalExp * 100) : 0 };
                });
                cats.sort((a, b) => b.amount - a.amount);
                return { cats, totalExp, count: expenseTxs.length };
            }
            function calcCreditTotal() {
                return state.credits.filter(c => c.status === 'active').reduce((s, c) => s + (c.remaining_amount_minor || 0), 0);
            }
            function calcRecurringMonthExpected() {
                return state.recurringExpenses.filter(r => r.active).reduce((s, r) => s + (r.amount_minor || 0), 0);
            }
            function calcRecurringMonthPaid(periodKey) {
                const range = getPeriodRange(periodKey);
                return state.recurringPayments.filter(p => isInRange(p.paid_at || p.due_date, range)).reduce((s, p) => s + (p.amount_minor || 0), 0);
            }
            // ... (весь остальной код, включая render, модальные окна, обработчики, остаётся без изменений)
            // ==================== RENDER ====================
            function renderAll() {
                renderHeader();
                renderNav();
                renderMain();
                validateFinanceState();
            }
            function renderHeader() {
                const name = state.user?.first_name || (isTelegram ? tg.initDataUnsafe?.user?.first_name : null) || 'Алекс';
                const username = state.user?.username || (isTelegram ? tg.initDataUnsafe?.user?.username : null) || '';
                $('#greetingName').textContent = 'Привет, ' + name;
                $('#greetingSub').textContent = CONFIG.DEMO_MODE ? 'Демо-режим' : (username ? '@' + username : '');
                const avatarEl = $('#avatarEl');
                avatarEl.textContent = name.charAt(0).toUpperCase();
                if (isTelegram && tg.initDataUnsafe?.user?.photo_url) avatarEl.innerHTML = `<img src="${tg.initDataUnsafe.user.photo_url}" alt="">`;
                $('#demoBadge').style.display = CONFIG.DEMO_MODE ? 'block' : 'none';
                const ps = $('#periodSelector');
                ps.innerHTML = CONFIG.PERIODS.map(p => `<button class="${state.selectedPeriod===p.key?'active':''}" data-period="${p.key}">${p.label}</button>`).join('');
                ps.querySelectorAll('button').forEach(b => b.onclick = () => { state.selectedPeriod = b.dataset.period; renderAll(); });
                const header = $('#appHeader');
                const main = $('#mainContent');
                if (main.scrollTop > 10) header.classList.add('scrolled'); else header.classList.remove('scrolled');
            }
            function renderNav() {
                const tabs = [
                    { key: 'dashboard', label: 'Главная', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>' },
                    { key: 'transactions', label: 'Операции', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>' },
                    { key: 'obligations', label: 'Обязательные', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' },
                    { key: 'analytics', label: 'Аналитика', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>' },
                    { key: 'settings', label: 'Настройки', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>' },
                ];
                $('#bottomNav').innerHTML = tabs.map(t => `<button class="${state.currentTab===t.key?'active':''}" data-tab="${t.key}" aria-label="${t.label}">${t.svg}<span>${t.label}</span></button>`).join('');
                $('#bottomNav').querySelectorAll('button').forEach(b => b.onclick = () => { state.currentTab = b.dataset.tab; renderAll(); });
            }
            function renderMain() {
                const main = $('#mainContent');
                if (state.loading) { main.innerHTML = renderSkeleton(); return; }
                if (state.error) { main.innerHTML = renderError(); return; }
                switch (state.currentTab) {
                    case 'dashboard': main.innerHTML = renderDashboard(); break;
                    case 'transactions': main.innerHTML = renderTransactions(); break;
                    case 'obligations': main.innerHTML = renderObligations(); break;
                    case 'analytics': main.innerHTML = renderAnalytics(); break;
                    case 'settings': main.innerHTML = renderSettings(); break;
                }
                bindDashboardActions();
                bindTxActions();
                bindObligationActions();
                bindSettingsActions();
            }
            function renderSkeleton() { return '<div class="card"><div class="skeleton skeleton-block"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>'; }
            function renderError() {
                const msg = state.error || 'Неизвестная ошибка';
                return '<div class="error-banner" onclick="location.reload()">⚠️ ' + escapeHTML(msg) + '. Нажмите, чтобы повторить.</div>';
            }
            // (остальные функции render без изменений, они уже были в предыдущем полном коде)
            // ==================== BOOTSTRAP ====================
            async function bootstrap() {
                state.loading = true;
                renderAll();
                try {
                    if (CONFIG.DEMO_MODE) {
                        initDemoStorage();
                        state.user = { id: 'demo_user', first_name: 'Алекс', username: 'alex_demo' };
                    } else {
                        const data = await apiRequest('bootstrap');
                        state.user = data.user;
                        state.settings = data.settings;
                        state.transactions = data.transactions || [];
                        state.credits = data.credits || [];
                        state.creditPayments = data.creditPayments || [];
                        state.recurringExpenses = data.recurringExpenses || [];
                        state.recurringPayments = data.recurringPayments || [];
                        state.categories = data.categories || [];
                    }
                    state.loading = false;
                    state.error = null;
                } catch (e) {
                    state.loading = false;
                    state.error = e.message;
                    if (CONFIG.DEMO_MODE) {
                        initDemoStorage();
                        state.user = { id: 'demo_user', first_name: 'Алекс', username: 'alex_demo' };
                        state.error = null; state.loading = false;
                    }
                }
                renderAll();
                if (CONFIG.DEMO_MODE) runSelfTests();
            }
            document.addEventListener('DOMContentLoaded', () => {
                const main = $('#mainContent');
                if (main) main.addEventListener('scroll', function() {
                    const header = $('#appHeader');
                    if (header) header.classList.toggle('scrolled', this.scrollTop > 10);
                });
            });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
            bootstrap();
        })();
    </script>
</body>
</html>
